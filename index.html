  <body class="antialiased font-sans bg-slate-950 text-slate-200 min-h-screen relative selection:bg-violet-500/30">
    
    <!-- Blurry Gradient Background Elements -->
    <div class="fixed inset-0 w-full h-full overflow-hidden pointer-events-none z-[-2]">
